name: The_Gate
version: 3.0.6mc26.2-spig
main: thegate.main.TheGateMain
load: POSTWORLD
authors: ['EndMySuffering', 'donner', 'lukas123313']
api-version: '26.2'

commands:
  Gatetools:
    description: Opens the Gatetools UI.
    usage: /gatetools
    aliases: [gt]
  TheGate:
    description: Functional command to reload the config or display information.
    usage: /thegate [reload|help|syncdb|gatedescription|gatename|create|rotate]
    aliases: [tg]

softdepend:
  - Multiverse-Core
  - IridiumSkyblock
  - Essentials

# SPIGOT VARIANT: PacketEvents is not bundled in this build - it must be installed
# separately as its own plugin. 'depend' (not 'softdepend') because the plugin
# genuinely cannot function without it here.
depend:
  - packetevents
