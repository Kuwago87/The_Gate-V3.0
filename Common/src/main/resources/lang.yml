#The-Gate-v0.2.8
#Note:
#You can edit all the text to your hearts content :D
#Do not give two GUI's the same name, it confuses the plugin
#You can add elements to lists or change their order
#{} marks variables the brackets are replaced with the contents of the variables you can if you want to remove the variables or change their order

GateDisplayText:
  - '&6Address: &3{ADDRESS}'
  - '&6World: &3{WORLD}'
  - '&6Name: &3{GATENAME}'
  - '&6Network(s): &3{NETWORK1} {NETWORK2}'
  - '&6Owner: &3{OWNER}'
  - '&6Info: &3{DESCRIPTION}'

GUIS:
  AbydosGUI:
    GUIName: '&5Abydos Cartouche'
    Items:
      GateObjects:
        Lore: 
          - 'GateName: {GATENAME}'
          - 'World: {WORLD}'
          - 'Location: '
          - 'X: {X}'
          - 'Y: {Y}'
          - 'Z: {Z}'
          - 'Net: {NETWORK}'
          - 'Owner: {OWNER}'
          - '{DESCRIPTION}'
      NextPage: 'Next Page'
      PreviousPage: 'Previous Page'
  
  AddressAssignGUI:
    GUIName: '&5Address Assign GUI'
    Items:
      Address-not-allowed: 'ADDRESS NOT ALLOWED'
      Clear: 'CLEAR'
      Randomize: 'Randomize'
      CreateGate: 'CREATE Gate!'
  
  DHD_GUI:
    GUIName: '&5DHD &3{ADDRESS}'
    Items:
      Dial:
        Name: 'DIAL'
        Lore: 'Activates the Gate'
      Clear_Dial:
        Name: 'CLEAR DIAL'
        Lore: 'Clears the DHD dial'
      GateLocked: 'Gate IS LOCKED'
      QuickDial: 'QuickDial'
      Iris: '&6Iris'
      
  EditAllGatesGUI:
    GUIName: '&5Edit Gate List GUI'
    Items:
      Save: '&6Save Gate list'
      Load: '&6Load Gate list'
      Repair: '&6Repair ALL Gates'
      Remove_Armorstands: #change that Armor Stands
        Name: '&6Remove ALL Gates'
        Lore: 'Only Removes Armor Stands'
      Clear_Gate_List:
        Name: '&6Clear Gate list'
        Lore1: 'Removes Armor Stands'
        Lore2: 'and removes the Gate from the Gate network'
      Cut_all_Gate_connections: '&6Cut all Gate connections'

  EditGateGUI:
    GUIName: '&5Edit Gate GUI &3{ADDRESS}'
    Items:
      Unlock: '&6Unlocked'
      Lock: '&6Locked'
      BlockIncoming: '&6Block incoming'
      BlockOutgoing: '&6Block outgoing'
      Repair: '&6Repair Gate'
      Remove_Event_Horizon:
        Name: '&6RemoveEventHorizon'
        Lore1: 'Removes Armor stands'
        Lore2: 'and cuts the connection'
      Remove_Ring:
        Name: '&6RemoveRing'
        Lore: 'Only removes Armor stands'
      Remove_Gate:
        Name: '&6Remove Gate'
        Lore1: 'Removes all Armor stands'
        Lore2: 'and removes Gate from list'
      UseGatePerms:
        Name: '&6Using Gate Perms: {VALUE}'
        Lore:
          - ''
          - '&bIf true users have to have'
          - '&6thegate.user.dial.<address>'
          - '&6thegate.user.teleport.<address>'
          - '&bin order to &6dial &bor &6teleport &4FROM &6or &4TO &bthis gate'
          - '&bthese permissions are in addition to'
          - '&6thegate.user.dialgate and thegate.user.allowteleport'
          - ''
          - '&b-> &6<address> &bin this case &6{ADDRESS}'
      Remove_DHD:
        Name: '&6Remove DHD'
        Lore: 'Will remove the DHD from the Gate'
      Teleport_to_Gate: '&6Teleport to Gate'
      Open: '&6Open'
      Private: '&6Private'
      Secondary_Network: '&6Secondary Network'
      Gate_Material: '&6Gate Material'
      Reset_Material: '&6Reset to default Material'
      Set_Gate_Material: '&6Set Gate material'
      Ring_Material: '&6Ring Material'
      Chevron_tip: '&6Chevron tip'
      Chevron_frame: '&6Chevron frame'
      Chevron_Light_off: '&6Chevron Light off'
      Chevron_Light_on: '&6Chevron Light on'
      Horizon_Material: '&6Horizon Material'
      AddCoOwner:
        Name: '&6Add CoOwner'
      ListCoOwner:
        Name: '&6Remove CoOwner'
      GateOwner:
        Name: '&6Gate Owner: {OWNER_NAME}'
      IrisSettings:
        Name: '&6Iris Settings'
  
  GateCrystalGUI:
    GUIName: '&5Gate Crystal GUI '
    Items:
      DHDCrystal:
        Name: '&5DHDCrystal'
        Lore: '&6GateAddress:'
  
  NetworkAssignGUI:
    Primary: 'Main Network'
    Secondary: 'Second Network'
    GUIName: '&5{NETNAME}_AssingGUI'
    Items:
      Network: 'Network:'
      Next_Page: 'Next Page'
      Previous_Page: 'Previous Page'
      Back: '&6Back'
   
  QuickDialGUI:
    GUIName: '&5Quick Dial GUI'
    Items:
      Back: '&6Back'
      GateObjects:
        Lore: 
          - 'GateName: {GATENAME}'
          - 'World: {WORLD}'
          - 'Location: '
          - 'X: {X}'
          - 'Y: {Y}'
          - 'Z: {Z}'
          - 'Net: {NETWORK}'
          - 'Owner: {OWNER}'
          - '{DESCRIPTION}'
      NextPage: 'Next Page'
      PreviousPage: 'Previous Page'      
    
  GateTools:
    GUIName: '&5Gate Tools GUI'
    Items:
      CreateTool:
        Name: '&5GateCreator_Tool'
        Lore: '&fCreates the Gate'
      EditTool:
        Name: '&5GateEditor_Tool'
        Lore: '&fEdit the Gate'
      AbydosCartouche:
        Name: '&5Abydos Cartouche'
        Lore: '&fList of all known Gate addresses'
      IDCTransmitter:
        Name: '&5IDC Transmitter'
        Lore: '&fTransmits the Iris deactivation code thru a Gate'
  
  AddCoOwner:
    GUIName: '&5Add Co-Owner: {ADDRESS}'
    Items:
      NextPage: 'Next Page'
      PreviousPage: 'Previous Page'
      BackToEditGUI: 'Back'
      Info: 
        Name: 'Info'
        Text: '&6Clicking a player head will add him to the CoOwnler list.'
  
  RemoveCoOwner:
    GUIName: '&5Remove of CoOwner: {ADDRESS}'
    Items:
      NextPage: 'Next Page'
      PreviousPage: 'Previous Page'
      BackToEditGUI: 'Back'
      Info: 
        Name: 'Info'
        Text: '&6Clicking a player head will remove him from the CoOwner list.'
        
  SetGateOwner:
    GUIName: '&5Set Gate owner: {ADDRESS}'
    Items:
      NextPage: 'Next Page'
      PreviousPage: 'Previous Page'
      BackToEditGUI: 'Back'
      Info: 
        Name: 'Info'
        Text: '&6Clicking a player head will make him the owner of the Gate and you the one of the CoOwner(s).'

  IrisEditGUI:
    GUIName: '&5Iris Edit GUI'
    Items:
      Clear: 'CLEAR'
      CurrentIDC: '&6Current IDC: {IDC}'
      SetNewIDC: '&6Set new IDC'
      IrisMaterial: '&6Iris Material'
      SetIrisMaterial: '&6Set Iris Material'
      Back: '&6Back'
      
  IDCTransmitter:
    GUIName: '&5IDC Transmitter'
    Items:
      Clear: 'CLEAR'
      Transmitt: 'Transmit' # change Transmit
      Open: '&aIris Open'
      Opening: '&6Iris Opening'
      Closed: '&4Iris Closed'
      CodeDenied: '&8Code Denied'
       
